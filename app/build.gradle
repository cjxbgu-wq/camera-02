plugins {
    id 'com.android.application'
}

android {
    namespace 'a.a.a'
    compileSdk 34
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "a.a.a"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // 使用 CMake 编译还原的 native 库
    externalNativeBuild {
        cmake {
            path '../libimage_processing_util_jni/CMakeLists.txt'
            version '3.18.1+'
        }
    }

    buildFeatures {
        viewBinding false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // 示例代码仅用 android.app.Activity, 无需 AppCompat 仓库依赖
}
