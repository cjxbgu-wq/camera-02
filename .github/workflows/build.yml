name: Build APK (arm64-v8a)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform, build-tools, NDK, CMake)
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Self-test C algorithm (gcc)
        run: gcc test_restored.c -o t && ./t

      - name: Build debug APK (embeds native .so)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: camera-02-debug-apk
          path: app/build/outputs/apk/debug/*.apk
