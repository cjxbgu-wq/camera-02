name: Build native .so (arm64-v8a)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android NDK r25b
        run: |
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q ndk.zip
          echo "NDK=$PWD/android-ndk-r25b" >> "$GITHUB_ENV"

      - name: ndk-build (libimage_processing_util_jni)
        run: |
          export PATH="$NDK:$PATH"
          cd libimage_processing_util_jni
          ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk

      - name: Self-test C algorithm (gcc)
        run: |
          gcc test_restored.c -o t && ./t

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libimage_processing_util_jni-arm64-v8a
          path: libimage_processing_util_jni/libs/arm64-v8a/*.so
